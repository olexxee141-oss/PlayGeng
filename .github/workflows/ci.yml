name: CI

on:
  push:
    branches: [main, "phase-1/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck
